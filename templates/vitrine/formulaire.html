{% extends "vitrine/base.html" %}
{% block titre %}{{ titre }} · {{ etablissement_nom }}{% endblock %}
{% block navigation %}{% endblock %}
{% block contenu %}
<section class="v-page-formulaire">
  <div class="v-conteneur">
    <div class="v-boite">
      <h1>{{ titre }}</h1>
      <form method="post" novalidate>{% csrf_token %}
        {% include "partials/champs.html" %}
        <button class="btn grand" type="submit">Enregistrer</button>
      </form>
      <p class="v-lien-bas"><a href="{% url 'vitrine:espace' %}">Retour à mon espace</a></p>
    </div>
  </div>
</section>
{% endblock %}
